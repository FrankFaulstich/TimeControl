name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.14"
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements-ci.txt

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        
    - name: Run Unit Tests
      run: python -m unittest discover tests

  # The documentation is generated from the docstrings, and autodoc treats a
  # module it cannot import as a warning rather than an error: the build
  # succeeds, and the page simply comes out without that chapter. That is how
  # issue #560 went unnoticed - modules.rst still pointed at TimeTracker.py
  # after it had moved into tt/, and the published page covered one module out
  # of seventeen while reading as if it were complete.
  #
  # -W makes every warning a failure and --keep-going lists them all rather
  # than stopping at the first.
  #
  # tests/test_documentation.py already checks the module list itself, on
  # every run of the matrix above and without Sphinx installed. This job is
  # for what a text check cannot see: reStructuredText inside a docstring
  # that autodoc chokes on. One Python version is enough - nothing about a
  # docstring depends on it.
  docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        cache-dependency-path: |
          requirements-ci.txt
          docs/requirements.txt

    # Both files: autodoc imports what it documents, so the application's own
    # dependencies have to be installed for the build to see anything.
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt -r docs/requirements.txt

    - name: Build the Documentation
      run: sphinx-build -b html -W --keep-going docs docs/_build/html

  # The sync server is PHP, and its operation log is the one place in this
  # project where a mistake costs data rather than a red build. Its tests need
  # no web server, so they run here - as a job of their own rather than across
  # the matrix above, because nothing about them depends on the Python
  # version.
  #
  # On 7.4 deliberately: that is the floor index.php enforces and roughly what
  # shared hosting offers. Development happens against a much newer PHP, so
  # without this a version-8 idiom would pass here and fail on the machine
  # that actually matters.
  server-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'

    - name: Check Syntax
      run: |
        for file in php-server/tc/index.php php-server/tc/setup.php \
                    php-server/tc/lib/*.php php-server/test-*.php; do
          php -l "$file"
        done

    # The log and compaction, called directly against a throwaway store.
    - name: Run Server Tests
      run: php php-server/test-oplog.php

    # And index.php itself, over real HTTP against PHP's own built-in server
    # - the routing, the size limits and the snapshot response, which is
    # assembled by hand rather than through json_encode.
    - name: Run Endpoint Tests
      run: php php-server/test-endpoints.php

    # The installer's proof that the store is not readable over the web. Also
    # over HTTP, because what an outsider can fetch is the only form that
    # question has an answer in.
    - name: Run Installer Tests
      run: php php-server/test-setup.php