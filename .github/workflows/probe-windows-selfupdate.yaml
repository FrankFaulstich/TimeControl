name: Probe - Windows self-update assumptions

# THROWAWAY. Delete this file once it has answered its questions.
#
# A frozen build cannot update itself the way the source install does: it has
# no loose .py files to overwrite, and Windows will not let a running .exe be
# overwritten. The plan is to rename the running .exe out of the way instead,
# put the new one in its place and relaunch - which rests on two assumptions
# that are worth proving on a real Windows machine before any code is built
# on them. Neither can be checked from macOS.
#
#   1. A running PyInstaller onefile .exe - with child processes started from
#      the same image, as TimeControl does - can be RENAMED, even though it
#      cannot be overwritten or deleted.
#
#   2. A file written by our own Python code does NOT get a Mark-of-the-Web
#      (the Zone.Identifier stream that browsers attach), so the replacement
#      .exe should not raise SmartScreen's "Windows protected your PC" -
#      which matters because signing is not on the table for now.
#
# It also checks what Defender makes of a freshly written, unsigned .exe.
#
# The job does not fail on a negative answer: "no" is a result too, and the
# summary below is meant to be read rather than inferred from a red cross.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # A stand-in rather than the real application: it reproduces the one
      # property under test - a running onefile .exe that has spawned another
      # process from the same image - and builds in seconds instead of
      # minutes. TimeControl re-invokes itself with --tc-streamlit-subprocess
      # exactly like this.
      - name: Write and build the probe executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import os, sys, time

          here = os.path.dirname(os.path.abspath(sys.executable))

          if "--child" in sys.argv:
              open(os.path.join(here, "child-running.txt"), "w").write(str(os.getpid()))
              time.sleep(120)
              sys.exit(0)

          import subprocess
          subprocess.Popen([sys.executable, "--child"])
          open(os.path.join(here, "parent-running.txt"), "w").write(str(os.getpid()))
          time.sleep(120)
          '@ | Set-Content -Path probe_app.py -Encoding utf8

          pyinstaller --onefile --name probe probe_app.py --distpath dist --workpath build --specpath . --noconfirm
          if (-not (Test-Path dist/probe.exe)) { throw "probe.exe was not built" }

      - name: Assumption 1 - can a running .exe be renamed?
        id: rename
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # Absolute, because the working directory moves below.
          $src = Join-Path $env:GITHUB_WORKSPACE "dist\probe.exe"
          $dir = Join-Path $env:RUNNER_TEMP "probe"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item $src (Join-Path $dir "probe.exe")
          Push-Location $dir

          Start-Process -FilePath (Join-Path $dir "probe.exe") -WindowStyle Hidden
          $waited = 0
          while (-not (Test-Path "child-running.txt") -and $waited -lt 30) {
            Start-Sleep -Seconds 1; $waited++
          }
          $running = @(Get-Process -Name probe -ErrorAction SilentlyContinue)
          Write-Host "probe processes running: $($running.Count)"
          "processes=$($running.Count)" >> $env:GITHUB_OUTPUT

          # The control: overwriting the image is expected to be refused. If
          # this ever succeeds the whole rename dance is unnecessary.
          $overwrite = "refused"
          try {
            Copy-Item $src (Join-Path $dir "probe.exe") -Force -ErrorAction Stop
            $overwrite = "ALLOWED"
          } catch { }
          Write-Host "overwrite while running: $overwrite"
          "overwrite=$overwrite" >> $env:GITHUB_OUTPUT

          # The assumption under test.
          $rename = "FAILED"
          try {
            Rename-Item -Path "probe.exe" -NewName "probe.old.exe" -ErrorAction Stop
            $rename = "ok"
          } catch {
            Write-Host "rename error: $($_.Exception.Message)"
          }
          Write-Host "rename while running: $rename"
          "rename=$rename" >> $env:GITHUB_OUTPUT

          # And does the swapped-in replacement actually start?
          $relaunch = "not attempted"
          if ($rename -eq "ok") {
            Copy-Item $src (Join-Path $dir "probe.exe")
            Remove-Item "child-running.txt","parent-running.txt" -ErrorAction SilentlyContinue
            Start-Process -FilePath (Join-Path $dir "probe.exe") -WindowStyle Hidden
            $waited = 0
            while (-not (Test-Path "child-running.txt") -and $waited -lt 30) {
              Start-Sleep -Seconds 1; $waited++
            }
            $relaunch = if (Test-Path "child-running.txt") { "ok" } else { "FAILED" }
          }
          Write-Host "replacement starts: $relaunch"
          "relaunch=$relaunch" >> $env:GITHUB_OUTPUT

          # Can the renamed old image be cleared away once its processes end?
          Get-Process -Name probe -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $cleanup = "FAILED"
          try {
            Remove-Item "probe.old.exe" -ErrorAction Stop
            $cleanup = "ok"
          } catch {
            Write-Host "cleanup error: $($_.Exception.Message)"
          }
          Write-Host "old image deletable after exit: $cleanup"
          "cleanup=$cleanup" >> $env:GITHUB_OUTPUT
          Pop-Location

      - name: Assumption 2 - does a Python-written download carry a Mark-of-the-Web?
        id: motw
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $dir = Join-Path $env:RUNNER_TEMP "motw"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          # Written the way update.py would write it, from a real HTTPS
          # download, so the answer is about our actual method.
          @'
          import os, sys, urllib.request
          url = "https://raw.githubusercontent.com/FrankFaulstich/TimeControl/main/README.md"
          data = urllib.request.urlopen(url, timeout=30).read()
          with open(os.path.join(sys.argv[1], "by-python.bin"), "wb") as f:
              f.write(data)
          print("written", len(data), "bytes")
          '@ | Set-Content -Path fetch.py -Encoding utf8
          python fetch.py $dir

          # For contrast, the way PowerShell would fetch it.
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/FrankFaulstich/TimeControl/main/README.md" `
                            -OutFile (Join-Path $dir "by-powershell.bin")

          foreach ($name in @("by-python.bin", "by-powershell.bin")) {
            $p = Join-Path $dir $name
            $zone = Get-Content -Path $p -Stream Zone.Identifier -ErrorAction SilentlyContinue
            $has = if ($zone) { "PRESENT" } else { "absent" }
            Write-Host "$name -> Mark-of-the-Web $has"
            if ($zone) { Write-Host ($zone -join "; ") }
            if ($name -eq "by-python.bin") { "python_motw=$has" >> $env:GITHUB_OUTPUT }
            else { "powershell_motw=$has" >> $env:GITHUB_OUTPUT }
          }

      - name: What Defender makes of a freshly written unsigned .exe
        id: defender
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $dir = Join-Path $env:RUNNER_TEMP "defender"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $target = Join-Path $dir "probe.exe"
          # Copied with Python, as the updater would write it.
          $src = Join-Path $env:GITHUB_WORKSPACE "dist\probe.exe"
          @'
          import shutil, sys
          shutil.copyfile(sys.argv[1], sys.argv[2])
          '@ | Set-Content -Path copyfile.py -Encoding utf8
          python copyfile.py $src $target

          $verdict = "not scanned"
          try {
            Start-MpScan -ScanType CustomScan -ScanPath $dir -ErrorAction Stop
            Start-Sleep -Seconds 3
            $verdict = if (Test-Path $target) { "survived the scan" } else { "REMOVED by Defender" }
          } catch {
            $verdict = "scan unavailable: $($_.Exception.Message)"
          }
          Write-Host "defender: $verdict"
          "verdict=$verdict" >> $env:GITHUB_OUTPUT

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $rows = @(
            "| Question | Result |",
            "|---|---|",
            "| probe processes running during the test | ${{ steps.rename.outputs.processes }} |",
            "| overwrite a running .exe (expected: refused) | ${{ steps.rename.outputs.overwrite }} |",
            "| **rename a running .exe** | **${{ steps.rename.outputs.rename }}** |",
            "| replacement .exe starts afterwards | ${{ steps.rename.outputs.relaunch }} |",
            "| old image deletable once its processes end | ${{ steps.rename.outputs.cleanup }} |",
            "| **Mark-of-the-Web on a Python-written download** | **${{ steps.motw.outputs.python_motw }}** |",
            "| Mark-of-the-Web via Invoke-WebRequest (contrast) | ${{ steps.motw.outputs.powershell_motw }} |",
            "| Defender on a freshly written unsigned .exe | ${{ steps.defender.outputs.verdict }} |"
          )
          $rows -join "`n" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
          Write-Host ""
          Write-Host "rename=ok and Mark-of-the-Web=absent means the planned design holds."
