name: Probe - Windows self-update assumptions

# THROWAWAY. Delete this file once it has answered its questions.
#
# Settled by the first two rounds, and no longer re-tested here:
#
#   - A running onefile .exe cannot be overwritten but CAN be renamed, with
#     several processes alive from the same image. The replacement starts,
#     and the old image is deletable once its processes end.
#   - The running process can do that to itself: os.rename on its own image
#     and shutil.copy2 of the replacement into the freed path both succeed,
#     from a directory whose name contains spaces.
#   - A file written by our own Python download carries no Mark-of-the-Web,
#     on a volume that demonstrably does record alternate data streams. So
#     the replacement will not raise SmartScreen, which is what made this
#     approach viable without a signing certificate.
#
# What is left is the last step of the dance. Round two relaunched the
# replacement with a plain subprocess.Popen and then exited immediately: the
# call raised nothing and the new process never ran. Round one had done the
# same relaunch successfully - but from PowerShell, not from inside the
# frozen process.
#
# The leading explanation is PyInstaller's own handover. A onefile build
# unpacks itself into a temporary directory and tells the second stage about
# it through the environment (_MEIPASS2 on older versions, _PYI_* on 6.x).
# A frozen process that spawns its own image passes those variables straight
# on, so the new process believes it is that second stage, skips unpacking
# and runs out of the parent's temporary directory - which the parent deletes
# on the way out. That is harmless for TimeControl's normal subprocesses,
# where the parent stays alive, and fatal for an update relaunch, where it
# does not.
#
# This round tries six ways of starting the replacement and reports which
# ones survive the launcher's exit. The job does not fail on a negative
# answer: the table is the result.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # A stand-in for the real application: a onefile build that spawns
      # another process from its own image, which is what TimeControl does
      # with --tc-streamlit-subprocess. It builds in seconds rather than
      # minutes and reproduces the property under test.
      - name: Write and build the probe executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import json, os, shutil, subprocess, sys, time

          me = os.path.abspath(sys.executable)
          here = os.path.dirname(me)

          # Only defined on Windows; falling back to 0 keeps this script
          # runnable on a developer machine for a dry run of the logic.
          DETACHED = (getattr(subprocess, "DETACHED_PROCESS", 0)
                      | getattr(subprocess, "CREATE_NEW_PROCESS_GROUP", 0))

          def mark(name):
              with open(os.path.join(here, name), "w") as handle:
                  handle.write(str(os.getpid()))

          def arg_after(flag):
              return sys.argv[sys.argv.index(flag) + 1]

          if "--marker" in sys.argv:
              mark(arg_after("--marker"))
              time.sleep(45)
              sys.exit(0)

          if "--selfupdate" in sys.argv:
              strategy = arg_after("--selfupdate")

              # A second process from this same image, so the swap happens
              # under the real conditions rather than against a lone .exe.
              subprocess.Popen([me, "--marker", "child.txt"])
              for _ in range(30):
                  if os.path.exists(os.path.join(here, "child.txt")):
                      break
                  time.sleep(1)

              result = {"strategy": strategy,
                        "child_up": os.path.exists(os.path.join(here, "child.txt"))}

              try:
                  os.rename(me, me + ".old")
                  result["rename"] = "ok"
              except OSError as exc:
                  result["rename"] = "FAILED: %s" % exc

              if result["rename"] == "ok":
                  try:
                      shutil.copy2(os.path.join(here, "stash", "probe.exe"), me)
                      result["write"] = "ok"
                  except OSError as exc:
                      result["write"] = "FAILED: %s" % exc

              if result.get("write") == "ok":
                  # Everything PyInstaller uses to tell a second stage that
                  # the bundle is already unpacked.
                  clean = {k: v for k, v in os.environ.items()
                           if not k.startswith("_MEI") and not k.startswith("_PYI")}
                  launch = [me, "--marker", "ran.txt"]
                  try:
                      if strategy == "plain":
                          subprocess.Popen(launch)
                      elif strategy == "cleanenv":
                          subprocess.Popen(launch, env=clean)
                      elif strategy == "detached":
                          subprocess.Popen(launch, close_fds=True, creationflags=DETACHED)
                      elif strategy == "both":
                          subprocess.Popen(launch, env=clean, close_fds=True,
                                           creationflags=DETACHED)
                      elif strategy == "linger":
                          # Does the launcher merely need to outlive the
                          # child's first moments?
                          subprocess.Popen(launch)
                          time.sleep(8)
                      elif strategy == "startfile":
                          if hasattr(os, "startfile"):
                              os.startfile(me, arguments="--marker ran.txt")
                          else:
                              result["launch"] = "os.startfile not available here"
                      result.setdefault("launch", "no error")
                  except OSError as exc:
                      result["launch"] = "FAILED: %s" % exc

              with open(os.path.join(here, "report.json"), "w") as handle:
                  json.dump(result, handle)
              sys.exit(0)

          subprocess.Popen([me, "--marker", "child.txt"])
          mark("parent.txt")
          time.sleep(120)
          '@ | Set-Content -Path probe_app.py -Encoding utf8

          pyinstaller --onefile --name probe probe_app.py --distpath dist --workpath build --specpath . --noconfirm
          if (-not (Test-Path dist/probe.exe)) { throw "probe.exe was not built" }

      - name: Which relaunch survives the launcher's exit?
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $src = Join-Path $env:GITHUB_WORKSPACE "dist\probe.exe"

          "| Relaunch strategy | Result |" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "|---|---|" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          # "plain" is round two's failing baseline and has to be repeated
          # here: without it reproducing, a success anywhere else would say
          # nothing about what actually changed.
          foreach ($strategy in @("plain", "cleanenv", "detached", "both", "linger", "startfile")) {
            # Named like a OneDrive folder, so spaces and a dash stay covered.
            $dir = Join-Path $env:RUNNER_TEMP "OneDrive - Test Company GmbH\$strategy"
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $dir "stash") -Force | Out-Null
            Copy-Item $src (Join-Path $dir "probe.exe")
            Copy-Item $src (Join-Path $dir "stash\probe.exe")

            Start-Process -FilePath (Join-Path $dir "probe.exe") `
                          -ArgumentList "--selfupdate", $strategy -WindowStyle Hidden

            $report = Join-Path $dir "report.json"
            $waited = 0
            while (-not (Test-Path $report) -and $waited -lt 90) { Start-Sleep -Seconds 1; $waited++ }

            $verdict = "the probe never reported"
            if (Test-Path $report) {
              $r = Get-Content $report -Raw | ConvertFrom-Json
              Write-Host "$strategy report: $($r | ConvertTo-Json -Compress)"
              if ($r.rename -ne "ok" -or $r.write -ne "ok") {
                $verdict = "swap failed (rename=$($r.rename), write=$($r.write))"
              } elseif ($r.launch -ne "no error") {
                $verdict = "the launch call itself failed: $($r.launch)"
              } else {
                $waited = 0
                while (-not (Test-Path (Join-Path $dir "ran.txt")) -and $waited -lt 40) {
                  Start-Sleep -Seconds 1; $waited++
                }
                $verdict = if (Test-Path (Join-Path $dir "ran.txt")) { "**RAN**" } else { "never ran" }
              }
            }
            Write-Host "$strategy -> $verdict"
            "| ``$strategy`` | $verdict |" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

            Get-Process -Name probe -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
          }

          "" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "``plain`` is expected to fail - it is round two's result. Any strategy marked RAN is one the updater can use." | Add-Content -Path $env:GITHUB_STEP_SUMMARY
