name: Build Windows Executable

# PyInstaller cannot cross-compile - a Windows .exe can only be produced by
# running it on Windows itself, which is exactly what the windows-latest
# runner below is for. Triggered on version tags (matching this project's
# existing "3.xx" release-tagging convention) so a tagged release gets a
# downloadable .exe attached automatically, plus workflow_dispatch for an
# on-demand build in between releases.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller TimeControl.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeControl-windows-exe
          path: dist/TimeControl.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TimeControl.exe
