name: Build Windows Executable

# PyInstaller cannot cross-compile - a Windows .exe can only be produced by
# running it on Windows itself, which is exactly what the windows-latest
# runner below is for. Triggered on version tags (matching this project's
# existing "3.xx" release-tagging convention) so a tagged release gets a
# downloadable .exe attached automatically, plus workflow_dispatch for an
# on-demand build in between releases.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller TimeControl.spec --noconfirm

      # Published alongside the .exe so the in-app updater can tell a
      # complete, untampered download from a truncated one before it puts the
      # result in the place of the user's working program (see update.py's
      # _published_checksum). Written in the conventional "<hex>  <name>"
      # shape, so `sha256sum -c` and Get-FileHash comparisons both work for
      # anyone checking a download by hand.
      - name: Compute checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hash = (Get-FileHash "dist/TimeControl.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  TimeControl.exe" | Set-Content -Path "dist/TimeControl.exe.sha256" -Encoding ascii
          Write-Host "sha256: $hash"

      # Runs the actual built .exe (in its own throwaway directory, so the
      # config.json/data.json it creates never end up inside dist/ - the
      # only thing the steps below publish) and confirms Streamlit comes up
      # on the configured port. This is deliberately the extent of it:
      # pywebview's window itself (WebView2 rendering) isn't reliably
      # checkable on a CI runner the way it is on a real Windows desktop, so
      # asserting on that here would risk failing builds over a CI-sandbox
      # quirk rather than an actual problem for users. Checking that
      # Streamlit itself starts is still the check that matters most: it's
      # exactly what would have caught the frozen-build-only bug found
      # while first setting this up (Streamlit misdetecting a PyInstaller
      # bundle as "development mode" and refusing --server.port).
      - name: Smoke test executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testDir = Join-Path $env:RUNNER_TEMP "tc-smoke-test"
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          Copy-Item "dist/TimeControl.exe" (Join-Path $testDir "TimeControl.exe")

          Push-Location $testDir
          $proc = Start-Process -FilePath ".\TimeControl.exe" -PassThru
          $serverResponded = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) {
                Write-Host "Process exited early with code $($proc.ExitCode)"
                break
              }
              try {
                $resp = Invoke-WebRequest -Uri "http://localhost:8501" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $serverResponded = $true; break }
              } catch { }
            }
          } finally {
            Get-Process -Name "TimeControl" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

          $configCreated = Test-Path (Join-Path $testDir "config.json")
          $dataCreated = Test-Path (Join-Path $testDir "data.json")
          Pop-Location

          if (-not $serverResponded) {
            Write-Error "Streamlit server never responded on http://localhost:8501 within the timeout."
            exit 1
          }
          if (-not $configCreated) {
            Write-Error "config.json was not created next to the executable."
            exit 1
          }
          if (-not $dataCreated) {
            Write-Error "data.json was not created next to the executable."
            exit 1
          }
          Write-Host "Smoke test passed: Streamlit responded and config.json/data.json were created next to the executable."

      # The step above proves the build runs. This one proves it can replace
      # itself, which is the half of the update that Windows makes awkward:
      # a running .exe cannot be overwritten, so the updater renames it aside
      # and puts the new one in its place (see update.py).
      #
      # Worth doing against the real build rather than trusting the throwaway
      # probe that worked this out, because the real one differs exactly
      # where it matters - tens of megabytes, and two or three processes
      # started from its own image. A copy of the same build stands in for a
      # download; whether the version changes is beside the point.
      #
      # The assertion that carries this is not "the files moved" but "the
      # replacement came up", and specifically that the process we started is
      # no longer the one serving. Relaunching after the swap is where this
      # went wrong three times: the call raised nothing and the new process
      # died on the spot. Without the exit check a failed relaunch would look
      # like success here, because the original process carries on and starts
      # Streamlit itself.
      - name: Smoke test the self-update
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:GITHUB_WORKSPACE "dist\TimeControl.exe"
          $testDir = Join-Path $env:RUNNER_TEMP "tc-smoke-test"

          Get-Process -Name "TimeControl" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          # Exactly what the in-app updater leaves behind for the next start.
          Copy-Item $src (Join-Path $testDir "TimeControl.exe.new")

          Push-Location $testDir
          $proc = Start-Process -FilePath ".\TimeControl.exe" -PassThru
          $serverResponded = $false
          $firstExited = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $resp = Invoke-WebRequest -Uri "http://localhost:8501" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $serverResponded = $true; break }
              } catch { }
            }
            # Read before the cleanup below, which would make it true anyway.
            $firstExited = $proc.HasExited
          } finally {
            Get-Process -Name "TimeControl" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

          $swappedIn = -not (Test-Path "TimeControl.exe.new")
          $rollbackKept = Test-Path "TimeControl.exe.old"
          $dataKept = Test-Path "data.json"
          Pop-Location

          if (-not $swappedIn) {
            Write-Error "TimeControl.exe.new is still there - the update was never installed."
            exit 1
          }
          if (-not $rollbackKept) {
            Write-Error "TimeControl.exe.old is missing - the replaced build was not kept as a rollback."
            exit 1
          }
          if (-not $firstExited) {
            Write-Error "The process that performed the swap is still running - it never handed over, so Streamlit is being served by the old image."
            exit 1
          }
          if (-not $serverResponded) {
            Write-Error "The swapped-in executable never brought Streamlit up within the timeout - the relaunch did not run."
            exit 1
          }
          if (-not $dataKept) {
            Write-Error "data.json did not survive the update."
            exit 1
          }
          Write-Host "Self-update smoke test passed: image replaced, previous build kept as a rollback, the replacement handed over and came up, data intact."

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TimeControl-windows-exe
          path: |
            dist/TimeControl.exe
            dist/TimeControl.exe.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/TimeControl.exe
            dist/TimeControl.exe.sha256
          generate_release_notes: true
