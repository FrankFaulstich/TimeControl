name: Build Windows Executable

# PyInstaller cannot cross-compile - a Windows .exe can only be produced by
# running it on Windows itself, which is exactly what the windows-latest
# runner below is for. Triggered on version tags (matching this project's
# existing "3.xx" release-tagging convention) so a tagged release gets a
# downloadable .exe attached automatically, plus workflow_dispatch for an
# on-demand build in between releases.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller TimeControl.spec --noconfirm

      # Published alongside the .exe so the in-app updater can tell a
      # complete, untampered download from a truncated one before it puts the
      # result in the place of the user's working program (see update.py's
      # _published_checksum). Written in the conventional "<hex>  <name>"
      # shape, so `sha256sum -c` and Get-FileHash comparisons both work for
      # anyone checking a download by hand.
      - name: Compute checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hash = (Get-FileHash "dist/TimeControl.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  TimeControl.exe" | Set-Content -Path "dist/TimeControl.exe.sha256" -Encoding ascii
          Write-Host "sha256: $hash"

      # Runs the actual built .exe (in its own throwaway directory, so the
      # config.json/data.json it creates never end up inside dist/ - the
      # only thing the steps below publish) and confirms Streamlit comes up
      # on the configured port. This is deliberately the extent of it:
      # pywebview's window itself (WebView2 rendering) isn't reliably
      # checkable on a CI runner the way it is on a real Windows desktop, so
      # asserting on that here would risk failing builds over a CI-sandbox
      # quirk rather than an actual problem for users. Checking that
      # Streamlit itself starts is still the check that matters most: it's
      # exactly what would have caught the frozen-build-only bug found
      # while first setting this up (Streamlit misdetecting a PyInstaller
      # bundle as "development mode" and refusing --server.port).
      - name: Smoke test executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testDir = Join-Path $env:RUNNER_TEMP "tc-smoke-test"
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          Copy-Item "dist/TimeControl.exe" (Join-Path $testDir "TimeControl.exe")

          Push-Location $testDir
          $proc = Start-Process -FilePath ".\TimeControl.exe" -PassThru
          $serverResponded = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) {
                Write-Host "Process exited early with code $($proc.ExitCode)"
                break
              }
              try {
                $resp = Invoke-WebRequest -Uri "http://localhost:8501" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) { $serverResponded = $true; break }
              } catch { }
            }
          } finally {
            Get-Process -Name "TimeControl" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

          $configCreated = Test-Path (Join-Path $testDir "config.json")
          $dataCreated = Test-Path (Join-Path $testDir "data.json")
          Pop-Location

          if (-not $serverResponded) {
            Write-Error "Streamlit server never responded on http://localhost:8501 within the timeout."
            exit 1
          }
          if (-not $configCreated) {
            Write-Error "config.json was not created next to the executable."
            exit 1
          }
          if (-not $dataCreated) {
            Write-Error "data.json was not created next to the executable."
            exit 1
          }
          Write-Host "Smoke test passed: Streamlit responded and config.json/data.json were created next to the executable."

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TimeControl-windows-exe
          path: |
            dist/TimeControl.exe
            dist/TimeControl.exe.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/TimeControl.exe
            dist/TimeControl.exe.sha256
          generate_release_notes: true
